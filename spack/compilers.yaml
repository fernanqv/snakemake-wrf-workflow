# Spack compilers configuration for HPC cluster
# This file defines the available compilers for building WRF

# For most HPC clusters, you'll have one of these compiler stacks:
# - GCC (via module system): module load GCC/11.3.0
# - Intel compilers (via module system): module load intel
# - NVIDIA HPC SDK (via module system): module load nvhpc

# Example configuration for GCC (adjust paths for your cluster)
compilers:
  - compiler:
      spec: gcc@11.3.0
      paths:
        cc: /usr/bin/gcc
        cxx: /usr/bin/g++
        f77: /usr/bin/gfortran
        f90: /usr/bin/gfortran
      flags: {}
      operating_system: linux
      target: x86_64
      modules:
        - GCC/11.3.0  # Adjust to your cluster's module name
      environment: {}
      extra_rpaths: []

