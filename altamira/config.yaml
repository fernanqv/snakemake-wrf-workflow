executor: slurm

jobs: 10

printshellcmds: true
keep-going: true
rerun-incomplete: true
show-failed-logs: true

latency-wait: 60

default-resources:
  - slurm_partition=compute
  - mem_mb_per_cpu=10000

slurm-logdir: logs/slurm
slurm-keep-successful-logs: true

execution:
  mpi_launcher: "srun"

# set_env.sh variables
config:
  local_modules_path: ""
  wrf_version: "4.6.1"
  wps_version: "4.6.0"
  toolchain_suffix: "-foss-2024a-dmpar"
