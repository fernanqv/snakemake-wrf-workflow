runs:
  - 2000
era5_domain: "EUR"

# Use 'repo_root_custom' to point to a location other than the repo's.
# repo_root_custom: "/gpfs/projects/meteo/WORK/ASNA/projects/"

run_dir: "run/{year}"
grib_basedir: "data/ERA5"
geog_data_path: "data/WPS_GEOG_LOW_RES"
geo_em_path: "data/geo_em/lowres/{era5_domain}"

namelist_wps: "config/templates/toy_example/namelist.wps"
namelist_input: "config/templates/toy_example/namelist.input"

toolchain_suffix: "-foss-2024a-dmpar"
eessi_init_script: "/cvmfs/software.eessi.io/versions/2025.06/init/bash"

wrf_version: "4.6.1"
wps_version: "4.6.0"
wps_install_dir: "cordex-core/02_SAM12_evaluation/rundir/WPS"
wrf_install_dir: "cordex-core/02_SAM12_evaluation/rundir/WRFv4.6.1-cordex_core"

Vtable: "Vtable.ERA-interim.pl"
METGRID.TBL: "METGRID.TBL"
GEOGRID.TBL: "GEOGRID.TBL.ARW"
CAMtr_volume_mixing_ratio: "CAMtr_volume_mixing_ratio"

# WRF/WPS compilation
enable_compilation: true  # enable/disable compilation
compilation_repo: "orviz/snakemake-wrf-wps-compilation"
compilation_version: "0.5.0-alpha3"
compilation_config:
  compiler: "intel"
