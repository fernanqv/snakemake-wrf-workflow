# Local configuration for the Ubuntu-EESSI-WRF WSL2 distribution.
runs:
  - 2000

# Keep data, generated files, and software on the Linux ext4 filesystem.
grib_basedir: "/home/wrf/wrf-data/ERA5"
run_dir: "/home/wrf/wrf-runs/{year}"
wps_install_dir: "/home/wrf/software/WPS-4.6.0"
wrf_install_dir: "/home/wrf/software/WRF-4.6.1"
geog_data_path: "/home/wrf/wrf-data/WPS_GEOG_LOW_RES"
geog_data_url: "https://www2.mmm.ucar.edu/wrf/src/wps_files/geog_low_res_mandatory.tar.gz"
era5_domain: "EUR"
geo_em_path: "/home/wrf/wrf-data/geo_em/lowres/{era5_domain}"

# Templates from the repository copy stored inside WSL.
namelist_wps: "/home/wrf/src/snakemake-wrf-workflow/config/templates/toy_example/namelist.wps"
namelist_input: "/home/wrf/src/snakemake-wrf-workflow/config/templates/toy_example/namelist.input"

Vtable: "Vtable.ERA-interim.pl"
METGRID.TBL: "METGRID.TBL"
GEOGRID.TBL: "GEOGRID.TBL.ARW"
CAMtr_volume_mixing_ratio: "CAMtr_volume_mixing_ratio"

# Compile WPS/WRF with the external Snakemake module and the EESSI 2025.06
# foss-2024a toolchain. "intel" denotes the detected EESSI CPU hierarchy.
enable_compilation: true
compilation_repo: "orviz/snakemake-wrf-wps-compilation"
compilation_version: "0.4.0"
compilation_config:
  eessi_init_script: "/cvmfs/software.eessi.io/versions/2025.06/init/bash"
  wps_version: "4.6.0"
  wrf_version: "4.6.1"
  compiler: "intel"
  prefix: "/home/wrf/software/wrf_compile"
  toolchain_suffix: "-foss-2024a-dmpar"
