[workspace]
name = "snakemake-wps-eessi"
version = "0.1.0"
description = "Workflow to compile WPS over EESSI using Snakemake"
authors = ["Pablo Orviz <orviz@ifca.es>", "Valvanuz Fernández <valvanuz.fernandez@unican.es"]
channels = ["conda-forge", "bioconda"] # Specific channels for HPC
platforms = ["linux-64"]

[dependencies]
python = ">=3.10"
conda = "*"

# --- SnakeMake ecosystem 8+ ---
snakemake = ">=8.0"
snakemake-executor-plugin-slurm = "*"

tcsh = "*"
cdo = ">=2.6.1,<3"
# This is required to generate the workflow PDF
graphviz = ">=14.1.2,<15"
# Keep the Conda packages compatible with snakemake-report-plugin-rocrate
# and its roc-validator dependency.
markdown-it-py = "<3"
rich = "<14"

[tasks]
# Local
dry-run     = "snakemake --dry-run --profile config/profiles/local"
run-local   = "snakemake --cores all --profile config/profiles/local"
run-rocrate = "snakemake --cores all --workflow-profile ro-crate"

# HPC profiles
[tasks.hpc-profile]
args = ["profile_name"]
cmd = "snakemake --profile config/profiles/{{ profile_name }} --config profile_name={{ profile_name }}"

[pypi-dependencies]
jinja2-shell = ">=0.1.4, <0.2"
jinja2-cli = ">=1.0.1, <2"
cdsapi = "*"
snakemake-report-plugin-rocrate = { git = "https://github.com/snakemake/snakemake-report-plugin-rocrate.git" }